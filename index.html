<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Assistant · Starting up</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0e0f13;
    --surface: #181a21;
    --surface-2: #1e2129;
    --border: rgba(255,255,255,0.08);
    --text: #ececf1;
    --text-muted: #9a9cab;
    --text-faint: #6c6e7d;
    --accent: #8b93ff;
    --accent-soft: rgba(139,147,255,0.14);
    --ok: #4ade80;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    display: grid; place-items: center; padding: 1.5rem;
    -webkit-font-smoothing: antialiased;
  }

  main { width: 100%; max-width: 26rem; text-align: center; }

  .mark {
    width: 56px; height: 56px; margin: 0 auto 1.75rem; border-radius: 16px;
    display: grid; place-items: center; font-size: 24px; color: var(--accent);
    background: var(--accent-soft); border: 1px solid rgba(139,147,255,.3);
    position: relative;
  }
  .mark::after {
    content: ""; position: absolute; inset: -9px; border-radius: 22px;
    border: 1px solid rgba(139,147,255,.35);
    animation: ring 2.4s ease-out infinite;
  }
  body.ready .mark::after { animation: none; opacity: 0; }
  @keyframes ring { 0% { transform: scale(.9); opacity: .8; } 100% { transform: scale(1.25); opacity: 0; } }

  h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -.025em; margin: 0 0 .5rem; }
  .sub { color: var(--text-muted); font-size: .95rem; line-height: 1.6; margin: 0 0 1.75rem; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.1rem 1.2rem; text-align: left;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .status { display: flex; align-items: center; gap: .6rem; font-size: .92rem; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none;
    animation: blink 1.4s ease-in-out infinite;
  }
  body.ready .dot { background: var(--ok); animation: none; box-shadow: 0 0 0 4px rgba(74,222,128,.15); }
  @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  .timer { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: .85rem; }

  .bar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 1rem; overflow: hidden; }
  .bar > div {
    height: 100%; width: 0%; border-radius: 4px; background: var(--accent);
    transition: width .6s ease;
  }
  body.ready .bar > div { background: var(--ok); width: 100% !important; }

  .hint { margin: .85rem 0 0; font-size: .8rem; line-height: 1.55; color: var(--text-faint); }

  .btn {
    display: none; margin: 1.25rem auto 0; padding: .7rem 1.2rem; border-radius: 12px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    font: 500 .9rem var(--font); cursor: pointer; text-decoration: none;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--surface-2); border-color: rgba(255,255,255,.16); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.show { display: inline-block; }

  @media (prefers-reduced-motion: reduce) {
    .mark::after, .dot { animation: none; }
    .bar > div { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">✦</div>
  <h1 id="title">Starting your assistant</h1>
  <p class="sub" id="sub">The server goes to sleep when nobody is using it. It usually wakes up within a minute.</p>

  <div class="card" role="status" aria-live="polite">
    <div class="row">
      <div class="status"><span class="dot"></span><span id="status">Waking up the server</span></div>
      <div class="timer" id="timer">0s</div>
    </div>
    <div class="bar"><div id="fill"></div></div>
    <p class="hint" id="hint">This page opens the assistant automatically as soon as it is ready.</p>
  </div>

  <a class="btn" id="open" href="#">Open the assistant now</a>
  <noscript><p class="sub">JavaScript is off. <a href="#" id="nojs" style="color:var(--accent)">Open the assistant</a></p></noscript>
</main>

<script>
  // ── Config: the only thing you need to edit ─────────────────
  const APP_URL = "https://gen-ai-chatbot-rqpg.onrender.com";   // no trailing slash
  const POLL_MS = 3000;       // how often to check
  const SHOW_BUTTON_AFTER_S = 45;   // manual fallback button appears after this
  const EXPECTED_S = 60;      // progress bar fills toward this (visual only)
  // ─────────────────────────────────────────────────────────────

  const $ = (id) => document.getElementById(id);
  const start = Date.now();
  let done = false;

  $("open").href = APP_URL;
  const nojs = $("nojs"); if (nojs) nojs.href = APP_URL;

  function elapsed() { return Math.floor((Date.now() - start) / 1000); }

  function stageFor(s) {
    if (s < 15) return "Waking up the server";
    if (s < 40) return "Installing and starting the app";
    if (s < 75) return "Almost there, finishing startup";
    return "Taking longer than usual, still trying";
  }

  function tick() {
    if (done) return;
    const s = elapsed();
    $("timer").textContent = s + "s";
    $("status").textContent = stageFor(s);
    // Ease toward 92% so the bar never looks finished before the app is
    $("fill").style.width = Math.min(92, (s / EXPECTED_S) * 92) + "%";
    if (s >= SHOW_BUTTON_AFTER_S) $("open").classList.add("show");
  }

  function ready() {
    if (done) return;
    done = true;
    document.body.classList.add("ready");
    $("title").textContent = "Your assistant is ready";
    $("sub").textContent = "Opening it now.";
    $("status").textContent = "Ready";
    $("hint").textContent = "";
    setTimeout(() => { window.location.replace(APP_URL); }, 600);
  }

  async function check() {
    if (done) return;
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    try {
      // Streamlit's health endpoint returns "ok" once the server is up.
      // Sleeping/starting servers return an error page or no CORS headers,
      // which makes fetch throw, and we simply try again.
      const res = await fetch(APP_URL + "/_stcore/health?t=" + Date.now(), {
        signal: ctrl.signal, cache: "no-store"
      });
      const body = (await res.text()).trim();
      if (res.ok && body === "ok") { ready(); return; }
    } catch (e) { /* still starting */ }
    finally { clearTimeout(t); }
    if (!done) setTimeout(check, POLL_MS);
  }

  setInterval(tick, 1000);
  tick();
  check();   // this first request is also what wakes the server up
</script>
</body>
</html>
